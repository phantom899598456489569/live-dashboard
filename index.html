<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b12;
    color: white;
}

header {
    padding: 20px;
    background: #15151f;
    border-bottom: 1px solid #292938;
}

header h1 {
    margin: 0;
    color: #a78bfa;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;
}

.card {
    background: #171722;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 14px;
    background: #0d0d16;
    border: 1px solid #383849;
    border-radius: 8px;
    color: white;
    margin: 10px 0;
}

button {
    padding: 12px 20px;
    background: #7c3aed;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    margin: 5px;
}

button:hover {
    background: #6d28d9;
}

.player {
    margin-top: 20px;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: black;
    border-radius: 10px;
    overflow: hidden;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
}

.status {
    color: #a78bfa;
    margin-top: 15px;
}

footer {
    text-align: center;
    color: #777;
    padding: 20px;
}
</style>
</head>

<body>

<header>
    <h1>LIVE DASHBOARD</h1>
</header>

<div class="container">

    <div class="card">
        <h2>YouTube Live Player</h2>
        <p>Paste a YouTube video or livestream URL below.</p>

        <input
            type="text"
            id="youtubeUrl"
            placeholder="Paste YouTube URL here..."
        >

        <button onclick="loadVideo()">Load Video</button>
        <button onclick="stopVideo()">Stop Player</button>

        <div class="status" id="status">
            Player is offline
        </div>

        <div class="player" id="player"></div>
    </div>

</div>

<footer>
    Live Dashboard | YouTube Embedded Player
</footer>

<script>
function getVideoId(url) {
    try {
        var parsed = new URL(url);

        if (parsed.hostname.indexOf("youtu.be") !== -1) {
            return parsed.pathname.substring(1);
        }

        if (parsed.hostname.indexOf("youtube.com") !== -1) {
            if (parsed.pathname === "/watch") {
                return parsed.searchParams.get("v");
            }

            if (parsed.pathname.indexOf("/live/") === 0) {
                return parsed.pathname.split("/live/")[1].split("/")[0];
            }

            if (parsed.pathname.indexOf("/embed/") === 0) {
                return parsed.pathname.split("/embed/")[1];
            }
        }

        return null;
    } catch (e) {
        return null;
    }
}

function loadVideo() {
    var url = document.getElementById("youtubeUrl").value;
    var videoId = getVideoId(url);

    if (!videoId) {
        document.getElementById("status").innerHTML =
            "Invalid YouTube URL";
        return;
    }

    document.getElementById("player").innerHTML =
        '<iframe src="https://www.youtube.com/embed/' +
        videoId +
        '?autoplay=1" allowfullscreen></iframe>';

    document.getElementById("status").innerHTML =
        "Player loaded";
}

function stopVideo() {
    document.getElementById("player").innerHTML = "";
    document.getElementById("status").innerHTML =
        "Player is offline";
}
</script>

</body>
</html>
